name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      # No ANTHROPIC_API_KEY is set, so the suite runs against the mock provider.
      # That is the point: every graph, the auditor, the metrics and the store are
      # exercised on every push without spending a token or hitting the network.
      - run: pytest --cov=crt_agent --cov-report=term-missing

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crt
          POSTGRES_PASSWORD: crt
          POSTGRES_DB: crt_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      # SQLite is permissive about types in ways Postgres is not, so the store gets
      # exercised against the real engine rather than only the local stand-in.
      - run: pytest tests/test_store_postgres.py -v
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://crt:crt@localhost:5432/crt_db

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Full offline benchmark sweep
        run: crt bench --perturbed 10 --novel 4 --failures 4
      - name: Cross-model sweep (mock backend, exercises the matrix path)
        run: crt bench --model mock-a --model mock-b --perturbed 2 --novel 1 --concurrency 4
