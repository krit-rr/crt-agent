[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crt-agent"
version = "0.1.0"
description = "A benchmarked reasoning agent for the Cognitive Reflection Test: symbolic, tool-grounded, and dual-process architectures compared."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Psychara Labs" }]

dependencies = [
    "anthropic>=0.40",
    "langgraph>=0.2",
    "langfuse>=3.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sympy>=1.12",
    "SQLAlchemy>=2.0",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
crt = "crt_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
